<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="app">
      <section id="start-screen">
        <h1>JavaScript Quiz</h1>
        <p>10 questions picked at random, 20 seconds each. Ready?</p>
        <p class="best" id="best"></p>
        <button class="primary" id="start">Start quiz</button>
      </section>

      <section id="quiz-screen" hidden>
        <header class="top">
          <span id="progress">Question 1 / 10</span>
          <span id="timer" aria-live="polite">20</span>
        </header>
        <div class="bar"><div class="bar-fill" id="bar"></div></div>
        <h2 id="question"></h2>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <button class="primary" id="next" hidden>Next</button>
      </section>

      <section id="result-screen" hidden>
        <h1>Your score</h1>
        <p class="score"><span id="score"></span> / 10</p>
        <p id="verdict"></p>
        <ol class="review" id="review"></ol>
        <button class="primary" id="restart">Play again</button>
      </section>
    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
